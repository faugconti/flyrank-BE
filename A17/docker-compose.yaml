services:
  api:
    build:
      context: .
      target: dev     # dev|prod
    ports: ["3000:3000"]
    env_file: .env
    depends_on: 
      db:
        condition: service_healthy

  db:
    image: postgres
    env_file: .env
    volumes: [taskdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  taskdata: